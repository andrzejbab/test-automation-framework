name: CI (Pull docker images - API/UI Tests)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    environment:
      name: Test_Framework
    steps:
      # Checkout code
      - uses: actions/checkout@v4

      # Create .env file with all required variables
      - name: Create .env file for Docker Compose
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          BACKEND_HOST=http://localhost:8000
          FRONTEND_HOST=http://localhost:3000
          ALLOWED_HOSTS=localhost,127.0.0.1
          DJANGO_ADMIN_USER=${{ secrets.DJANGO_ADMIN_USER }}
          DJANGO_ADMIN_EMAIL=${{ secrets.DJANGO_ADMIN_EMAIL }}
          DJANGO_ADMIN_PASSWORD=${{ secrets.DJANGO_ADMIN_PASSWORD }}
          REACT_APP_FRONTEND_HOST=${{ vars.REACT_APP_FRONTEND_HOST}}
          EOF
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # Build and start services using Docker Compose
      - name: Pull and start Docker containers (Backend, Frontend, Mailpit)
        run: |
          docker compose -f docker-compose-pull.yml pull
          docker compose -f docker-compose-pull.yml up -d

      - name: Wait for Backend to be ready
        run: |
          echo "Waiting for backend at: $TEST_API_BASE_URL"
          timeout 60 bash -c 'until curl -s "$TEST_API_BASE_URL" > /dev/null; do echo "Retrying..."; sleep 2; done' || (echo "Backend failed to start"; docker compose -f docker-compose-pull.yml logs backend; exit 1)
        env:
          TEST_API_BASE_URL: ${{ vars.TEST_API_BASE_URL}}

      - name: Wait for Frontend to be ready
        run: |
          echo "Waiting for frontend at: $TEST_UI_BASE_URL"
          timeout 60 bash -c 'until curl -s "$TEST_UI_BASE_URL" > /dev/null; do echo "Retrying..."; sleep 2; done' || (echo "Frontend failed to start"; docker compose -f docker-compose-pull.yml logs frontend; exit 1)
        env:
          TEST_UI_BASE_URL: ${{ vars.TEST_UI_BASE_URL}}

      - name: Wait for Mailpit to be ready
        run: |
          timeout 30 bash -c 'until curl -s http://localhost:8025/api/v1/info > /dev/null; do sleep 1; done'
          echo "Mailpit is ready!"

      # Install test dependencies
      - name: Set up Python for testing
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      # Tests
      - name: Run all tests (API and UI)
        continue-on-error: true
        run: pytest -m "api or ui"
        env:
          TEST_API_ADMIN_USERNAME: ${{ secrets.DJANGO_ADMIN_USER }}
          TEST_API_ADMIN_PASSWORD: ${{ secrets.DJANGO_ADMIN_PASSWORD }}
          TEST_API_BASE_URL: ${{ vars.TEST_API_BASE_URL}}
          TEST_UI_BASE_URL: ${{ vars.TEST_UI_BASE_URL}}
          MAILPIT_HOST: ${{ vars.MAILPIT_HOST}}
          UI_BROWSER: ${{ vars.UI_BROWSER}}
          UI_HEADLESS: ${{ vars.UI_HEADLESS}}

      - name: Generate Allure HTML Report
        if: always()
        # Ensure 'allure-results' matches the directory set in your pytest.ini
        run: |
          npm install -g allure-commandline
          allure generate tests/allure-results -o allure-report --clean

      - name: Upload Allure Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 14 # Keeps the report for 14 days to save storage

