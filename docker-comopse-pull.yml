services:
  backend:
    image: ghcr.io/andrzejbab/klubster/backend:latest
    ports:
      - "8000:8000"
    depends_on:
      - mailpit
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=True
      - EMAIL_HOST=host.docker.internal
      - EMAIL_PORT=1025
      - BACKEND_HOST=${BACKEND_HOST}
      - FRONTEND_HOST=${FRONTEND_HOST}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_ADMIN_USER}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_ADMIN_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_ADMIN_PASSWORD}

  frontend:
    image: ghcr.io/andrzejbab/klubster/frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REACT_APP_API_HOST=""
      #- REACT_APP_API_HOST=${REACT_APP_API_HOST}
      - REACT_APP_FRONTEND_HOST= ${REACT_APP_FRONTEND_HOST}


  mailpit:
    image: axllent/mailpit
    command: ["--smtp", "0.0.0.0:1025"]
    ports:
      - "1025:1025"
      - "8025:8025"