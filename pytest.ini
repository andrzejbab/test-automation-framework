[pytest]
testpaths = tests
addopts = -ra --alluredir=./tests/allure-results --clean-alluredir
DJANGO_SETTINGS_MODULE = backend.settings
pythonpath = backend
markers =
    api: API-layer tests
    ui: browser/UI tests
    smoke: quick critical path
    slow: long-running tests
    mock: tests using mocking
    integration: hits real services

# Custom CLI options (documented)
# --api-base-url: override API base URL (default from TEST_API_BASE_URL)
# --api-username: username for auth (default from TEST_API_USERNAME)
# --api-password: password for auth (default from TEST_API_PASSWORD)
# --use-mock-client: Force use of mock API client

# UI
# --ui-base-url: override UI base URL (default from TEST_UI_BASE_URL)
# --ui-browser: browser to use for UI tests (default from UI_BROWSER)
# --ui-headless: run browser in headless mode (default from UI_HEADLESS)
